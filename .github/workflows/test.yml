name: test
on:
  push:
    branches:
    - master
    - main
  pull_request:
    branches:
    - master
    - main
jobs:
  build:
    name: test
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-node@v7
      with:
        node-version: '24'
        cache: 'yarn'
    - run: |
        make install
        make check
