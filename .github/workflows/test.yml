name: test
on:
    push:
        branches:
            - master
            - main
    pull_request:
        branches:
            - master
            - main
jobs:
    build:
        name: test
        runs-on: ubuntu-latest
        steps:
            name: test
            runs-on: ubuntu-latest
            steps:
                - uses: actions/checkout@v7
                - uses: pnpm/action-setup@v6
                - uses: actions/setup-node@v7
                  with:
                      node-version: "26"
                      cache: "pnpm"
                - run: |
                      make install
                      make check
